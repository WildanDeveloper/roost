[package]
name = "roost"
version = "0.1.0"
edition = "2021"
description = "Pterodactyl Wings-compatible daemon written in Rust"
autobins = false

[[bin]]
name = "roost"
path = "main.rs"

[dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- HTTP + WebSocket server ---
axum = { version = "0.7", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }

# --- Docker API client ---
bollard = "0.16"
futures-util = "0.3"

# --- HTTP client ke Panel (wings -> panel) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart", "stream"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- JWT (websocket + download/upload/transfer token) ---
jsonwebtoken = "9"
subtle = "2"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Error handling ---
thiserror = "1"
anyhow = "1"

# --- Util ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
url = "2"

# --- File ops: archive, listing, disk usage ---
tar = "0.4"
flate2 = "1"
walkdir = "2"
nix = { version = "0.29", features = ["fs", "hostname", "feature"] }
base64 = "0.22"
bytes = "1"
russh-sftp = "2.4.0"
russh = "0.62"
tokio-util = "0.7.19"

[profile.release]
lto = true
